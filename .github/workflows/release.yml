# Builds and publishes a release when a version tag is pushed
# (scripts/release.ps1 creates it). Installed apps find it through
# releases/latest/download/update.json and update themselves.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the upstream check compares histories

      - uses: ./.github/actions/setup

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install git-filter-repo==2.47.0

      - name: Inno Setup
        run: choco install innosetup --version 6.7.1 --no-progress -y

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/cache
          key: build-cache-${{ hashFiles('scripts/binaries.json') }}

      - name: Every upstream merged (the release rule)
        run: pwsh scripts/check-upstreams.ps1

      - name: Tests
        run: pwsh -Command "Import-Module ./scripts/Upstreams.psm1; Invoke-AllTests"

      - name: Build
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: pwsh scripts/build.ps1

      - name: Check the version matches the tag
        shell: pwsh
        run: |
          $v = (Get-Content out/update.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "built $v for tag $env:GITHUB_REF_NAME" }

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @("Includes the latest code of every original project:", "") + (pwsh scripts/check-upstreams.ps1 -Markdown)
          $notes -join "`n" | Set-Content -Encoding utf8 out/notes.md
          # The installer also goes up under a fixed name, so releases/latest/download/StremioTurbo-x64.exe
          # (the README's download button) always points at the newest one.
          $installer = (Get-Item out/StremioTurbo-*-x64.exe).FullName
          New-Item -ItemType Directory -Force out/latest | Out-Null
          Copy-Item $installer out/latest/StremioTurbo-x64.exe
          gh release create $env:GITHUB_REF_NAME --title "Stremio Turbo $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file out/notes.md `
            $installer out/latest/StremioTurbo-x64.exe out/update.json out/descriptor.json out/descriptor.json.sig
