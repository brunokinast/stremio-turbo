# Daily: keeps one issue open while any original project has code we haven't
# merged (or a newer Stremio core is out), and closes it once we're current.
name: Upstream watch

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install git-filter-repo==2.47.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/cache/shell-upstream.git
          key: shell-upstream-${{ github.run_id }}
          restore-keys: shell-upstream-
      - name: Check and update the issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = pwsh scripts/check-upstreams.ps1 -Markdown
          $behind = $LASTEXITCODE -ne 0
          $title = 'Upstream moved: sync before the next release'
          $open = gh issue list --state open --search "in:title `"$title`"" --json number --jq '.[0].number'
          if ($behind) {
            $body = (@('Run `pwsh scripts/sync-upstreams.ps1`, then release.', '') + $report) -join "`n"
            if ($open) { gh issue edit $open --body $body } else { gh issue create --title $title --body $body }
          } elseif ($open) {
            gh issue close $open --comment 'Every upstream is merged.'
          }
